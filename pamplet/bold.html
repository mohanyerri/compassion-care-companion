<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Status Pamphlet · Bold</title>
<!-- How to edit: see the note at the top of index.html. Text is in the HTML below. -->
<link rel="stylesheet" href="editor.css">
<style>
  .poster {
    background: var(--blue-dark); color: #fff;
    display: flex; flex-direction: column; align-items: center; text-align: center;
    padding: 110px 80px 100px;
  }
  .brand { display: flex; align-items: center; gap: 16px; }
  .brand .mark { width: 96px; height: 57px; }
  .brand-word { font-size: 44px; font-weight: 700; letter-spacing: -0.035em; line-height: 1; }
  .brand-word .you { color: var(--apricot); }

  .line1 { margin: 170px 0 0; font-size: 116px; line-height: 1.02; font-weight: 800; letter-spacing: -0.04em; color: var(--blue-pale); }
  .line2 { margin: 30px 0 0; font-size: 210px; line-height: .95; font-weight: 900; letter-spacing: -0.05em; color: var(--apricot); }
  .sub { margin: 60px 0 0; font-size: 42px; line-height: 1.36; color: var(--blue-tint); max-width: 860px; }

  .big-mark { width: 300px; height: 178px; margin: 80px 0 0; }

  .cta { margin-top: auto; display: flex; flex-direction: column; align-items: center; }
  .cta .qr { width: 340px; height: 340px; border-radius: 30px; }
  .cta-label { margin: 40px 0 0; font-size: 34px; font-weight: 600; color: var(--blue-pale); }
  .cta-url { margin: 10px 0 0; font-size: 66px; font-weight: 800; letter-spacing: -0.02em; }
</style>
</head>
<body data-key="wys-pamphlet-bold" data-caption="You can't be there. We can. Hospital visit companions for parents in India. 👉 ">

<div class="poster" id="poster">
  <div class="brand">
    <div class="mark" data-logo="light"></div>
    <span class="brand-word">with<span class="you">you</span>seniors</span>
  </div>

  <h1 class="line1" data-edit="line1">You can't be at the hospital.</h1>
  <p class="line2" data-edit="line2">We can.</p>
  <p class="sub" data-edit="sub">Trained companions for your parents' hospital visits in India, with live updates to you abroad.</p>

  <div class="big-mark" data-logo="light"></div>

  <div class="cta">
    <div class="qr" data-size="290" aria-label="QR code to the website"></div>
    <p class="cta-label" data-edit="ctaLabel">Scan or tap the link to book</p>
    <p class="cta-url js-url">withyouseniors.in</p>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html-to-image@1.11.11/dist/html-to-image.js"></script>
<script src="editor.js"></script>
</body>
</html>
